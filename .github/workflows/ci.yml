name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -cover

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # "latest" puede resolver a un binario v1.x construido con una
          # versión de Go más vieja que la de go.mod (go 1.26), y
          # golangci-lint se niega a correr en ese caso. Se fija una
          # versión v2 explícita, consistente con lo usado localmente.
          version: v2.13.2
